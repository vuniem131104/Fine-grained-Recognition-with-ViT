[project]
name = "stream-inference"
version = "0.1.0"
description = "Kafka -> KServe streaming inference worker"
readme = "README.md"
authors = [
    { name = "vuniem131104", email = "niemhoalongvu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.11.0",
    "httpx>=0.25.0",
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "structlog>=23.0.0",
]

[project.scripts]
stream-inference = "stream_inference:main"

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

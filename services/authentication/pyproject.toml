[project]
name = "authentication"
version = "0.1.0"
description = "Authentication service for user management"
readme = "README.md"
authors = [
    { name = "vuniem131104", email = "niemhoalongvu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.128.0",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.1.0",
    "uvicorn>=0.40.0",
    "structlog>=25.5.0",
    "bcrypt>=4.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "email-validator>=2.0.0",
    "database",
]

[project.scripts]
authentication = "authentication:main"

[tool.uv.sources]
database = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []

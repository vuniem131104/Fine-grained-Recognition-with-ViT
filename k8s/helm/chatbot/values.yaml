namespace: core

chatbot:
  name: bird-chatbot
  replicaCount: 1
  image:
    repository: us-central1-docker.pkg.dev/project-8f21156c-3434-4d17-a8c/aide-project/bird-chatbot
    tag: "latest"
    pullPolicy: Always
  port: 8000
  resources:
    requests:
      cpu: "200m"
      memory: "384Mi"
    limits:
      cpu: "1500m"
      memory: "2Gi"

cloudSqlProxy:
  image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0
  port: 5432
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

serviceAccount:
  name: bird-chatbot-sa
  gcpServiceAccount: "bird-chatbot-sa@project-8f21156c-3434-4d17-a8c.iam.gserviceaccount.com"

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  host: "bird-chatbot.core.35.225.173.124.sslip.io"
  ingressClassName: nginx
  maxBodySize: "50m"
  name: bird-chatbot-ingress

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilization: 70
  targetMemoryUtilization: 90

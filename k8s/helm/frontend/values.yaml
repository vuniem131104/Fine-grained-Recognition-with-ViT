namespace: frontend

frontend:
  replicaCount: 1
  name: bird-frontend
  image:
    repository: us-central1-docker.pkg.dev/project-8f21156c-3434-4d17-a8c/aide-project/bird-frontend
    tag: "latest"
    pullPolicy: Always
  port: 5007
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

serviceAccount:
  name: bird-frontend-sa
  gcpServiceAccount: "bird-frontend-sa@project-8f21156c-3434-4d17-a8c.iam.gserviceaccount.com"

service:
  type: ClusterIP
  port: 80
  targetPort: 5007

ingress:
  name: bird-frontend-ingress
  enabled: true
  host: "bird-frontend.frontend.35.225.173.124.sslip.io"
  ingressClassName: nginx

env:
  authApiUrl: "http://bird-authentication.authentication.35.225.173.124.sslip.io"
  chatbotApiUrl: "http://bird-chatbot.core.35.225.173.124.sslip.io"

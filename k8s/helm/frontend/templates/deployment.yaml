apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontend.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.frontend.name }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.frontend.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.frontend.name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      initContainers:
      - name: env-config
        image: busybox
        command:
        - sh
        - -c
        - |
          cat > /mnt/env-config.js <<EOF
          window.__ENV__ = {
            REACT_APP_AUTH_API_URL: "{{ .Values.env.authApiUrl }}",
            REACT_APP_CHATBOT_API_URL: "{{ .Values.env.chatbotApiUrl }}"
          };
          EOF
        volumeMounts:
        - name: env-config
          mountPath: /mnt
      containers:
      - name: {{ .Values.frontend.name }}
        image: {{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}
        imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.frontend.port }}
          name: http
        volumeMounts:
        - name: env-config
          mountPath: /app/build/env-config.js
          subPath: env-config.js
        resources:
          {{- toYaml .Values.frontend.resources | nindent 10 }}
      volumes:
      - name: env-config
        emptyDir: {}

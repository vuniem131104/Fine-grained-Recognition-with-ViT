modelName: bird-classification-model

autoscaling:
  minReplicas: 1
  maxReplicas: 1
  scaleMetric: cpu
  scaleTarget: 80
  scaleToZeroPodRetentionPeriod: "900s"
  requestTimeout: "30s"

resources:
  requests:
    cpu: "200m"
    memory: "1Gi"
  limits:
    cpu: "500m"
    memory: "1500Mi"

serviceAccount:
  name: bird-serving-sa
  gcpServiceAccount: bird-serving-sa@project-8f21156c-3434-4d17-a8c.iam.gserviceaccount.com
  gcpProject: project-8f21156c-3434-4d17-a8c

predictor:
  storageUri: "gs://bird-classification-model-bucket/v1"
  torchserveResponseTimeout: "30"
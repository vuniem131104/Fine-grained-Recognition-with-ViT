namespace: authentication

authentication:
  name: bird-authentication
  replicaCount: 1
  image:
    repository: us-central1-docker.pkg.dev/project-8f21156c-3434-4d17-a8c/aide-project/bird-authentication
    tag: "latest"
    pullPolicy: Always
  port: 8001
  resources:
    requests:
      cpu: "100m"
      memory: "200Mi"
    limits:
      cpu: "250m"
      memory: "400Mi"

serviceAccount:
  name: bird-authentication-sa
  gcpServiceAccount: "bird-authentication-sa@project-8f21156c-3434-4d17-a8c.iam.gserviceaccount.com"

service:
  type: ClusterIP
  port: 8001
  targetPort: 8001

cloudSqlProxy:
  image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0
  port: 5432
  resources:
    requests:
      cpu: "50m"
      memory: "50Mi"
    limits:
      cpu: "100m"
      memory: "100Mi"

ingress:
  enabled: true
  host: "bird-authentication.authentication.35.225.173.124.sslip.io"
  ingressClassName: nginx
  maxBodySize: "10m"
  name: bird-authentication-ingress
